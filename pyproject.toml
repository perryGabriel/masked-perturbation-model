[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mpmgame"
version = "0.1.0"
description = "Masked-perturbation model security games for feedback systems"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "masked-perturbation-model contributors"}]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "control>=0.9.4",
  "matplotlib>=3.7",
  "networkx>=3.0",
  "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "jupyter>=1.0",
  "notebook>=7.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
